    <script>
      // Prevent theme flash
      (function() {
        try {
          var theme = localStorage.getItem('pulse_theme');
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
