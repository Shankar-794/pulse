services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: pulse-backend:local
    container_name: pulse-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]
      - SQLITE_DB_PATH=/app/data/pulse.db
      - AUTH_SECRET_KEY=local-verification-secret-key-change-in-production
    volumes:
      - pulse_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pulse_data:
    driver: local
